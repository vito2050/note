<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    {% seo %}
    <style>
      #toc { font-size: .95rem; border: 1px solid #e5e5e5; padding: .5rem .75rem; border-radius: 6px; background: #fafafa; margin-bottom: 1rem; }
      #toc ul { list-style: none; padding-left: 0; margin: 0; }
      #toc li { margin: .25rem 0; }
    </style>
  </head>
  <body>
    {% include header.html %}
    <main class="container" style="max-width: 860px; margin: 0 auto; padding: 1rem;">
      {% if page.toc != false %}
      <nav id="toc"><strong>目录</strong></nav>
      {% endif %}
      {{ content }}
    </main>
    {% if page.toc != false %}
    <script>
    (function() {
      var main = document.querySelector('main');
      if (!main) return;
      var headings = main.querySelectorAll('h1, h2, h3');
      if (!headings || headings.length === 0) return;
      var toc = document.getElementById('toc');
      if (!toc) return;
      var ul = document.createElement('ul');
      Array.prototype.forEach.call(headings, function(h) {
        if (!h.id) {
          var id = h.textContent.trim().toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, '-').replace(/^-+|-+$/g, '');
          h.id = id || ('h-' + Math.random().toString(36).slice(2));
        }
        var li = document.createElement('li');
        li.style.marginLeft = (h.tagName === 'H2' ? '12px' : (h.tagName === 'H3' ? '24px' : '0'));
        var a = document.createElement('a');
        a.textContent = h.textContent;
        a.href = '#' + h.id;
        li.appendChild(a);
        ul.appendChild(li);
      });
      toc.appendChild(ul);
    })();
    </script>
    {% endif %}
  </body>
</html>
